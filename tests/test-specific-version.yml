name: Test specific kustomize version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kustomize-version: '5.3.0'
      - name: Assert kustomize is on PATH
        run: |
          echo "Checking kustomize is available..."
          if ! command -v kustomize >/dev/null 2>&1; then
            echo "FAIL: kustomize not found on PATH"
            exit 1
          fi
          echo "PASS: kustomize found at $(command -v kustomize)"
      - name: Assert kustomize version is 5.3.0
        run: |
          VERSION_OUTPUT=$(kustomize version 2>&1)
          echo "kustomize version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "5.3.0"; then
            echo "PASS: kustomize version 5.3.0 confirmed"
          else
            echo "FAIL: expected version 5.3.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
